<!DOCTYPE html>
<html class="dark" lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Conexão WhatsApp | MindFlow AI</title>

  <!-- Scripts Base -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%221225 1800 545 510%22><path fill=%22%23FFFFFF%22 d=%22M1273.39 1843.81L1479.89 1843.8L1479.96 2020.86L1519.99 2021.08L1519.9 1843.92L1726.14 1843.94L1726.39 2259.94L1591.01 2259.86L1590.99 2189.94L1656.73 2190.08L1656.65 2030.85L1656.4 1913.62L1590.24 1913.46L1590.39 2090.8C1530.05 2090 1469.71 2089.78 1409.36 2090.13L1409.33 1914.44L1343.81 1914.31C1342.74 2003.67 1343.78 2099.69 1343.81 2189.58L1409.13 2189.73L1409.18 2259.87L1273.37 2259.7L1273.39 1843.81Z%22/></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #2E4FFF;
      --teal: #00B5A0;
      --blue2: #7B9AFF;
      --bg: #04060E;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 52px;
      overflow-x: hidden;
      font-family: 'Inter', sans-serif;
      color: #fff;
    }

    #neural-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      background: rgba(4, 6, 14, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      z-index: 50;
    }

    .logo-mark {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    @property --ba {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    @keyframes spin-border {
      to {
        --ba: 360deg;
      }
    }

    .card {
      --ba: 0deg;
      background:
        linear-gradient(rgba(8, 12, 24, 0.72), rgba(8, 12, 24, 0.72)) padding-box,
        conic-gradient(from var(--ba),
          rgba(46, 79, 255, 0) 0%,
          rgba(46, 79, 255, .75) 15%,
          rgba(0, 181, 160, .75) 38%,
          rgba(46, 79, 255, .75) 62%,
          rgba(0, 181, 160, .55) 80%,
          rgba(46, 79, 255, 0) 100%) border-box;
      border: 1px solid transparent;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      width: 100%;
      max-width: 540px;
      padding: 44px;
      box-shadow: 0 32px 64px rgba(0, 0, 0, .55);
      position: relative;
      z-index: 1;
      margin-top: auto;
      margin-bottom: auto;
      animation: spin-border 9s linear infinite;
      text-align: center;
    }

    .card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: #fff;
      margin-bottom: 8px;
    }

    .card-sub {
      font-size: 14px;
      color: #8e8fa2;
      margin-bottom: 36px;
      line-height: 1.5;
    }

    .qr-box {
      background: white;
      padding: 1.5rem;
      border-radius: 16px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .status-panel {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: var(--teal);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--teal);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(1.4);
      }
    }

    .status-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: #8e8fa2;
    }

    .btn-action {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, var(--blue) 0%, var(--teal) 100%);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 32px;
    }

    .btn-action:hover {
      filter: brightness(1.15);
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(46, 79, 255, 0.3);
    }

    .btn-danger {
      background: rgba(255, 78, 106, 0.1);
      color: #ff4e6a;
      border: 1px solid rgba(255, 78, 106, 0.2);
      margin-top: 12px;
    }

    .btn-danger:hover {
      background: #ff4e6a;
      color: #fff;
      box-shadow: 0 12px 24px rgba(255, 78, 106, 0.3);
    }

    .success-panel {
      display: none;
    }

    .success-panel.active {
      display: block;
      animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon-success {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, var(--teal), var(--blue));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 32px;
      box-shadow: 0 0 30px rgba(0, 181, 160, 0.3);
    }
  </style>
</head>

<body>
  <canvas id="neural-canvas"></canvas>

  <nav class="navbar">
    <a href="#" class="logo-mark">
      <span class="material-symbols-outlined">psychology</span>
      <span>MINDFLOW AI</span>
    </a>
  </nav>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; padding: 20px;">
    <div class="card">
      <!-- Tela de Conexão -->
      <div id="connection-flow">
        <h1 class="card-title">Ativar WhatsApp</h1>
        <p class="card-sub">Conecte sua instância Z-API para habilitar o processamento de mensagens por IA em tempo
          real.</p>

        <div class="qr-box" id="qr-code-canvas">
          <!-- QR Code Gerado Aqui -->
        </div>

        <div class="status-panel">
          <div class="dot"></div>
          <div class="status-text">Aguardando sinal da rede Mindflow...</div>
        </div>
      </div>

      <!-- Tela de Sucesso -->
      <div id="success-flow" class="success-panel">
        <div class="icon-success">✓</div>
        <h1 class="card-title">Sessão Ativa</h1>
        <p class="card-sub" id="success-details">O agente Mindflow AI já está monitorando suas conversas e automatizando
          fluxos.</p>

        <button class="btn-action" onclick="location.reload()">Acessar Painel</button>
        <button class="btn-action btn-danger" onclick="confirmarDesconexao()">Desativar Integração</button>
      </div>
    </div>
  </main>

  <script>
    const socket = io();
    const qrContainer = document.getElementById('qr-code-canvas');
    const connectionFlow = document.getElementById('connection-flow');
    const successFlow = document.getElementById('success-flow');
    const successDetails = document.getElementById('success-details');

    async function fetchQRCode() {
      try {
        const params = new URLSearchParams(window.location.search);
        params.append('t', new Date().getTime());
        const response = await fetch(`/api/qr-code?${params.toString()}`);
        const data = await response.json();

        if (data.connected) {
          clearInterval(qrInterval);
          connectionFlow.style.display = 'none';
          successFlow.classList.add('active');
          successDetails.innerText = `Sessão WhatsApp autenticada e vinculada à Mindflow AI com sucesso.`;
          return;
        }

        if (data.base64) {
          qrContainer.innerHTML = '';
          new QRCode(qrContainer, {
            text: data.base64,
            width: 250,
            height: 250,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
        }
      } catch (error) { console.error(error); }
    }

    let qrInterval = setInterval(fetchQRCode, 10000);
    fetchQRCode();

    socket.on('whatsapp-connected', (data) => {
      clearInterval(qrInterval);
      connectionFlow.style.display = 'none';
      successFlow.classList.add('active');
      successDetails.innerText = `WhatsApp ${data.phone} ativado via Z-API. Agente Mindflow pronto.`;
    });

    async function confirmarDesconexao() {
      if (confirm("Deseja realmente encerrar a sessão Mindflow AI?")) {
        const params = new URLSearchParams(window.location.search);
        const res = await fetch(`/api/disconnect?${params.toString()}`);
        const data = await res.json();
        if (data.success) location.reload();
      }
    }

    /* ANIMAÇÃO NEURAL OFICIAL MINDFLOW */
    (function () {
      const cv = document.getElementById('neural-canvas');
      const ctx = cv.getContext('2d');
      let W, H, t = 0;
      let dots = [], mouse = { x: -9999, y: -9999 };
      const PERFORMANCE_SCALE = 0.75;
      const BLUE = [46, 79, 255];
      const TEAL = [0, 181, 160];
      const GAP = 38;

      function rgba(rgb, a) { return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a.toFixed(3)})`; }

      function resize() {
        const realW = window.innerWidth; const realH = window.innerHeight;
        W = Math.min(realW, 2560); H = Math.min(realH, 1440);
        cv.width = realW * PERFORMANCE_SCALE; cv.height = realH * PERFORMANCE_SCALE;
        buildGrid();
      }

      function buildGrid() {
        dots = []; const cols = Math.ceil(W / GAP) + 2; const rows = Math.ceil(H / GAP) + 2;
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) dots.push({ bx: c * GAP - GAP, by: r * GAP - GAP, phase: (c * 0.35 + r * 0.55) + Math.random() * 0.4, colorPhase: Math.random() * Math.PI * 2 });
      }

      function waveAt(wx, wy, dx, dy) { const dist = Math.sqrt(dx * dx + dy * dy); return Math.sin(dist * 0.022 - t * 0.045 + wx * 0.01 + wy * 0.01) * Math.exp(-dist / (Math.min(W, H) * 0.55)); }

      function frame() {
        const realW = window.innerWidth; const realH = window.innerHeight;
        ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#04060E'; ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.scale((realW / W) * PERFORMANCE_SCALE, (realH / H) * PERFORMANCE_SCALE);
        dots.forEach(d => {
          let inf = 0;
          [{ nx: 0.18, ny: 0.72, s: 0.00018, o: 0 }, { nx: 0.82, ny: 0.28, s: 0.00014, o: 2.1 }, { nx: 0.5, ny: 0.15, s: 0.0002, o: 4.2 }].forEach(wv => {
            const wx = (wv.nx + Math.sin(t * wv.s + wv.o) * 0.18) * W; const wy = (0.5 + Math.cos(t * wv.s + wv.o) * 0.22) * H;
            inf += waveAt(wx, wy, d.bx - wx, d.by - wy);
          });
          inf /= 3;
          const x = d.bx + Math.sin(d.phase + t * 0.018) * 3.5 * inf * 4;
          const y = d.by + Math.cos(d.phase + t * 0.014) * 3.5 * inf * 4;
          const r = 0.9 + inf * 2.2; if (r <= 0) return;
          const mix = Math.sin(d.colorPhase + t * 0.008 + inf * 3) * 0.5 + 0.5;
          const rgb = [Math.round(BLUE[0] + (TEAL[0] - BLUE[0]) * mix), Math.round(BLUE[1] + (TEAL[1] - BLUE[1]) * mix), Math.round(BLUE[2] + (TEAL[2] - BLUE[2]) * mix)];
          const mdx = d.bx - (mouse.x * (W / realW)); const mdy = d.by - (mouse.y * (H / realH));
          const mGlow = Math.max(0, 1 - Math.sqrt(mdx * mdx + mdy * mdy) / 140);
          const br = 0.06 + Math.max(0, inf) * 0.55 + mGlow * 0.6;
          const g = ctx.createRadialGradient(x, y, 0, x, y, r * 5); g.addColorStop(0, rgba(rgb, br * 0.5)); g.addColorStop(0.4, rgba(rgb, br * 0.12)); g.addColorStop(1, rgba(rgb, 0));
          ctx.beginPath(); ctx.arc(x, y, r * 5, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
          ctx.beginPath(); ctx.arc(x, y, Math.max(0.3, r), 0, Math.PI * 2); ctx.fillStyle = rgba(rgb, 0.18 + Math.max(0, inf) * 0.65 + mGlow * 0.8); ctx.fill();
        });
        t++; requestAnimationFrame(frame);
      }
      resize(); window.addEventListener('resize', resize);
      window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
      window.addEventListener('mouseleave', () => { mouse.x = -9999, mouse.y = -9999; });
      frame();
    })();
  </script>
</body>

</html>
