<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Disparo de Ligação | MindFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue:  #2E4FFF;
  --teal:  #00B5A0;
  --blue2: #7B9AFF;
  --bg:    #04060E;
}

body {
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-top: 52px;
  overflow-x: hidden;
  font-family: 'Inter', sans-serif;
  color: #2D3448;
  -webkit-font-smoothing: antialiased;
}

#neural-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

.navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  background: rgba(4,6,14,0.65);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  z-index: 50;
}

.logo-mark {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: #fff;
}

@property --ba {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}

@keyframes spin-border { to { --ba: 360deg; } }

.card {
  --ba: 0deg;
  background:
    linear-gradient(rgba(8,12,24,0.72), rgba(8,12,24,0.72)) padding-box,
    conic-gradient(
      from var(--ba),
      rgba(46,79,255,0)   0%,
      rgba(46,79,255,.75) 15%,
      rgba(0,181,160,.75) 38%,
      rgba(46,79,255,.75) 62%,
      rgba(0,181,160,.55) 80%,
      rgba(46,79,255,0)  100%
    ) border-box;
  border: 1px solid transparent;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 16px;
  overflow: hidden;
  width: 100%;
  max-width: 540px;
  padding: 44px 44px 40px;
  box-shadow: 0 32px 64px rgba(0,0,0,.55);
  position: relative;
  animation: spin-border 9s linear infinite, cardIn .65s cubic-bezier(.16,1,.3,1) both;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card-header { text-align: center; margin-bottom: 36px; }
.card-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 28px; font-weight: 600;
  letter-spacing: -0.025em;
  color: #fff; margin-bottom: 6px;
}
.card-sub { font-size: 14px; color: #8e8fa2; }

.form { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

label {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px; font-weight: 500;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: #8e8fa2;
  margin-left: 2px;
}

.input-wrap { position: relative; display: flex; align-items: center; }

.input-ico {
  position: absolute; left: 12px;
  font-family: 'Material Symbols Outlined';
  font-size: 16px;
  color: #444656;
  pointer-events: none;
  user-select: none;
  font-variation-settings: 'FILL' 0, 'wght' 300;
}

.label-hint {
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.02em;
  text-transform: none;
  color: #4d5570;
  margin-left: 4px;
}

input {
  width: 100%;
  height: 46px;
  background: rgba(255,255,255,1);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 10px;
  color: #2D3448;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  padding: 0 14px;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
input.has-icon { padding-left: 38px; }
input.mono {
  font-family: 'Space Grotesk', monospace;
  font-size: 13px;
  letter-spacing: 0.06em;
  color: #4edcc5;
}
input::placeholder { color: #9ba0b0; }
input:focus {
  border-color: rgba(46,79,255,.75);
  box-shadow: 0 0 0 3px rgba(46,79,255,.14);
}
input:hover:not(:focus) { border-color: rgba(46,79,255,.3); }
input.input-error {
  border-color: rgba(255, 78, 106, 0.6);
  box-shadow: 0 0 0 3px rgba(255, 78, 106, 0.15);
}
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus {
  -webkit-text-fill-color: #2D3448;
  -webkit-box-shadow: 0 0 0px 1000px rgba(255,255,255,1) inset;
  transition: background-color 5000s ease-in-out 0s;
}

/* ── Scheduler toggle ── */
.schedule-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  cursor: pointer;
  transition: all .2s;
  user-select: none;
}
.schedule-toggle:hover {
  background: rgba(46,79,255,0.08);
  border-color: rgba(46,79,255,0.3);
}
.schedule-toggle-ico {
  font-family: 'Material Symbols Outlined';
  font-size: 18px;
  color: #7B9AFF;
  font-variation-settings: 'FILL' 0, 'wght' 300;
}
.schedule-toggle-text {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: #8e8fa2;
  flex: 1;
}
.schedule-toggle-text span {
  color: #7B9AFF;
  font-weight: 600;
}
.schedule-toggle-arrow {
  font-family: 'Material Symbols Outlined';
  font-size: 16px;
  color: #4d5570;
  font-variation-settings: 'FILL' 0, 'wght' 300;
  transition: transform .25s;
}
.schedule-toggle-arrow.open { transform: rotate(180deg); }

/* ── Mindflow Premium Motion Panel (In & Out) ── */
.scheduler-panel {
  display: flex; /* Mantemos flex para a estrutura interna */
  flex-direction: column;
  gap: 0;
  padding: 0 20px; /* Padding vertical zerado inicialmente */
  background: rgba(4,6,14,0.6);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  
  /* Estratégia para animação de fechamento */
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  pointer-events: none;
  transform: translateY(-12px) scale(0.97);
  
  transition: 
    max-height 500ms cubic-bezier(0.16, 1, 0.3, 1),
    opacity 400ms cubic-bezier(0.16, 1, 0.3, 1),
    transform 400ms cubic-bezier(0.16, 1, 0.3, 1),
    padding 500ms cubic-bezier(0.16, 1, 0.3, 1);
}

.scheduler-panel.open {
  max-height: 600px; /* Valor alto o suficiente para o conteúdo */
  opacity: 1;
  padding: 20px;
  pointer-events: all;
  transform: translateY(0) scale(1);
}

/* ── Time Slots Fade System ── */
#timeSlotsWrap {
  max-height: 0; /* Altura zero para esconder o espaço */
  opacity: 0;
  overflow: hidden; /* Garante que nada "vaze" para fora */
  visibility: hidden;
  transform: translateY(10px);
  transition: 
    max-height 600ms cubic-bezier(0.16, 1, 0.3, 1),
    opacity 400ms cubic-bezier(0.16, 1, 0.3, 1),
    transform 500ms cubic-bezier(0.16, 1, 0.3, 1),
    margin-top 600ms cubic-bezier(0.16, 1, 0.3, 1);
}

#timeSlotsWrap.visible {
  max-height: 320px; /* Altura suficiente para os botões de horário */
  opacity: 1;
  visibility: visible;
  margin-top: 24px; /* O espaço entre o calendário e as horas surge aqui */
  transform: translateY(0);
}

/* ── Mindflow Motion: Minimalist Ready State ── */
.btn {
  /* Garante que qualquer mudança no botão seja fluida */
  transition: 
    background 400ms cubic-bezier(0.16, 1, 0.3, 1),
    transform 400ms cubic-bezier(0.16, 1, 0.3, 1),
    box-shadow 400ms cubic-bezier(0.16, 1, 0.3, 1),
    filter 400ms cubic-bezier(0.16, 1, 0.3, 1);
}

.btn.ready, .btn.ready-immediate, .btn.ready-scheduled {
  filter: brightness(1.12) saturate(1.1);
  box-shadow: 0 8px 24px rgba(46, 79, 255, 0.2);
  transform: translateY(-1px);
}

@keyframes btnPulse {
  0% { box-shadow: 0 0 15px rgba(78, 220, 197, 0.3); transform: scale(1); }
  50% { box-shadow: 0 0 45px rgba(78, 220, 197, 0.6); transform: scale(1.02); }
  100% { box-shadow: 0 0 15px rgba(78, 220, 197, 0.3); transform: scale(1); }
}

/* ── Mindflow Validation Alert ── */
.validation-alert {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  background: rgba(255, 78, 106, 0.08); /* Fundo vermelho suave */
  border: 1px solid rgba(255, 78, 106, 0.2);
  border-radius: 10px;
  color: #ff4e6a; /* Cor de erro harmonizada com o tema escuro */

  /* Estrutura para expansão suave */
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  transform: translateY(-5px) scale(0.98);
  transition: 
    max-height 400ms cubic-bezier(0.16, 1, 0.3, 1),
    opacity 300ms cubic-bezier(0.16, 1, 0.3, 1),
    transform 300ms cubic-bezier(0.16, 1, 0.3, 1),
    padding 400ms cubic-bezier(0.16, 1, 0.3, 1),
    margin-bottom 400ms cubic-bezier(0.16, 1, 0.3, 1);
}

.validation-alert.show {
  max-height: 80px; /* Expande o suficiente para o texto */
  opacity: 1;
  padding: 12px 16px;
  margin-bottom: 12px; /* Empurra o botão de disparo para baixo */
  transform: translateY(0) scale(1);
}

.alert-ico {
  font-size: 18px;
  font-variation-settings: 'FILL' 1, 'wght' 400;
}

.alert-text {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.02em;
}

/* Calendar */
.cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
.cal-month {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: #e0e2ef;
  letter-spacing: -0.01em;
}
.cal-nav {
  background: none;
  border: none;
  cursor: pointer;
  font-family: 'Material Symbols Outlined';
  font-size: 18px;
  color: #4d5570;
  font-variation-settings: 'FILL' 0, 'wght' 300;
  padding: 4px;
  border-radius: 6px;
  transition: color .15s, background .15s;
  line-height: 1;
}
.cal-nav:hover { color: #e0e2ef; background: rgba(255,255,255,0.06); }

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}
.cal-weekday {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #4d5570;
  text-align: center;
  padding: 4px 0;
}
.cal-day {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  color: #8e8fa2;
  border-radius: 8px;
  cursor: pointer;
  transition: all .15s;
  border: 1px solid transparent;
}
.cal-day:hover:not(.empty):not(.past) {
  background: rgba(46,79,255,0.15);
  color: #e0e2ef;
  border-color: rgba(46,79,255,0.3);
}
.cal-day.today {
  color: #7B9AFF;
  font-weight: 600;
  border-color: rgba(123,154,255,0.3);
}
.cal-day.selected {
  background: linear-gradient(135deg, #2E4FFF, #00B5A0);
  color: #fff;
  font-weight: 600;
  border-color: transparent;
}
.cal-day.past { color: #2a2d3a; cursor: default; }
.cal-day.empty { cursor: default; }

/* Time slots */
.time-label {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #4d5570;
  margin-bottom: 2px;
}
.time-slots {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.time-slot {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 12px;
  font-weight: 500;
  color: #8e8fa2;
  padding: 6px 12px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  cursor: pointer;
  background: rgba(255,255,255,0.03);
  transition: all .15s;
}
.time-slot:hover {
  background: rgba(46,79,255,0.12);
  border-color: rgba(46,79,255,0.35);
  color: #e0e2ef;
}
.time-slot.selected {
  background: linear-gradient(135deg, rgba(46,79,255,0.3), rgba(0,181,160,0.3));
  border-color: rgba(0,181,160,0.5);
  color: #4edcc5;
  font-weight: 600;
}

/* Selected datetime display */
.schedule-summary {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: rgba(0,181,160,0.08);
  border: 1px solid rgba(0,181,160,0.2);
  border-radius: 8px;
}
.schedule-summary.visible { display: flex; }
.schedule-summary-ico {
  font-family: 'Material Symbols Outlined';
  font-size: 14px;
  color: #4edcc5;
  font-variation-settings: 'FILL' 0, 'wght' 300;
}
.schedule-summary-text {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px;
  font-weight: 500;
  color: #4edcc5;
  letter-spacing: 0.02em;
}

/* ── Divider ── */
.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.09), transparent);
  margin: 4px 0;
}

/* ── Button ── */
.btn {
  width: 100%; height: 52px;
  background: linear-gradient(135deg, var(--blue) 0%, var(--teal) 100%);
  border: none; border-radius: 10px;
  color: #fff;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px; font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  margin-top: 8px;
  transition: box-shadow .25s, opacity .2s, transform .12s;
}
.btn:hover:not(:disabled) { box-shadow: 0 0 28px rgba(46,79,255,.4); }
.btn:active:not(:disabled) { transform: scale(.985); }
.btn:disabled { opacity: .6; cursor: not-allowed; }
.btn .ico {
  font-family: 'Material Symbols Outlined';
  font-size: 18px;
  font-variation-settings: 'FILL' 0, 'wght' 400;
}

.status { margin-top: 22px; display: flex; justify-content: center; }
.pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 18px;
  border-radius: 9999px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px; font-weight: 500;
  letter-spacing: 0.09em; text-transform: uppercase;
  transition: all .35s ease;
}
.pill-ready  { background: rgba(78,220,197,.07); border: 1px solid rgba(78,220,197,.25); color: #4edcc5; }
.pill-call   { background: rgba(46,79,255,.10);  border: 1px solid rgba(46,79,255,.30); color: #7B9AFF; }
.pill-done   { background: rgba(78,220,197,.1);  border: 1px solid rgba(78,220,197,.35); color: #4edcc5; }

.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; animation: dotpulse 2.2s ease-in-out infinite; }
.dot-teal { background: #4edcc5; box-shadow: 0 0 6px #4edcc5; }
.dot-blue { background: #7B9AFF; box-shadow: 0 0 6px #7B9AFF; }
@keyframes dotpulse {
  0%,100% { opacity:1; transform:scale(1); }
  50%      { opacity:.4; transform:scale(.75); }
}

main {
  position: relative; z-index: 1;
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 24px 16px;
  width: 100%;
}

/* ── Mindflow Phone Prefix: Masterful Hover Reveal ── */

/* Scoped styles para garantir integridade visual */
.phone-master-field .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
}

/* O container da bandeira e do texto oculto */
.prefix-reveal-wrapper {
    position: absolute;
    left: 10px;
    display: flex;
    align-items: center;
    
    /* Design do mini frame premium */
    padding: 6px 10px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.03); /* quase invisível inicial */
    border: 1px solid rgba(255, 255, 255, 0.04);
    
    cursor: help; /* Indica ao usuário que há informação extra */
    z-index: 2; /* Acima do input */
    
    /* Transição suave para o efeito de expansão e brilho */
    transition: 
        background 0.4s ease, 
        border 0.4s ease, 
        box-shadow 0.4s ease, 
        left 0.4s ease;
}

/* Estado de Hover: O frame ganha vida e expande */
.prefix-reveal-wrapper:hover {
    background: rgba(255, 255, 255, 0.08); /* sutilmente mais visível */
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    left: 8px; /* pequeno movimento charmoso para a esquerda */
}

/* O Ícone Minimalista da Bandeira (SVG) */
.flag-icon {
    display: flex; /* Alinha o SVG perfeitamente */
    align-items: center;
    justify-content: center;
    width: 18px; /* Controla o tamanho do ícone */
    height: 12px; /* Mantém a proporção da bandeira */
    
    margin-right: 0px; /* Começa com espaço zero */
    filter: grayscale(0.2); /* Reduz levemente a saturação inicial */
    
    /* Transições independentes para o SVG */
    transition: margin-right 0.4s ease, filter 0.4s ease, width 0.4s ease;
}

/* Garante que o SVG preencha o container .flag-icon */
.flag-icon svg {
    width: 100%;
    height: 100%;
    display: block;
}

/* Estado de Hover da Bandeira */
.prefix-reveal-wrapper:hover .flag-icon {
    margin-right: 8px; /* Cria espaço para o texto que vai nascer */
    filter: grayscale(0); /* Bandeira ganha cor total */
}

/* O Texto do DDI (+55): O Segredo Revelado */
.prefix-text {
    display: inline-block;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: #a0a5b5; /* Cor secundária elegante para o DDI */
    letter-spacing: 0.02em;
    
    /* TÉCNICA DE REVELAÇÃO MASTERFUL */
    max-width: 0; /* Começa com largura zero (oculto) */
    opacity: 0; /* Começa invisível */
    overflow: hidden; /* Oculta o conteúdo enquanto colapsado */
    white-space: nowrap; /* Mantém o +55 em uma linha */
    
    /* Transições independentes para um efeito mais orgânico */
    transition: max-width 0.4s ease, opacity 0.3s ease, margin-left 0.4s ease;
}

/* Estado de Hover: O DDI nasce suavemente next to the flag */
.prefix-reveal-wrapper:hover .prefix-text {
    max-width: 40px; /* Expande para a largura exata do texto */
    opacity: 1; /* Revela o texto */
    margin-left: 2px; /* pequeno espaçamento final */
}

/* O INPUT DO TELEFONE: Ajuste Anatômico */
.master-phone-input {
    /* Começa com espaço apenas para a bandeira minimalista */
    padding-left: 55px !important; 
    
    /* Transição suave para o padding quando o prefixo expandir */
    transition: padding-left 0.4s ease, border-color 0.4s ease; 
}

/* TÉCNICA AVANÇADA (Mastery): Mudar o padding interno do input QUANDO o prefixo estiver em hover */
/* Nota: Requer suporte a :has() (navegadores modernos). Como é uma interface para automação premium, assumimos o suporte ou deixamos o design fluir. */
.phone-master-field .input-wrap:has(.prefix-reveal-wrapper:hover) .master-phone-input {
    padding-left: 98px !important; /* Aumenta o padding para acomodar o '+55' revelado */
}

/* ── Acessibilidade: focus-visible ── */
.schedule-toggle:focus-visible {
  outline: 2px solid rgba(123, 154, 255, 0.75);
  outline-offset: 2px;
}
.cal-day:focus-visible:not(.empty):not(.past) {
  outline: 2px solid rgba(46, 79, 255, 0.85);
  outline-offset: 1px;
  border-radius: 8px;
}
.time-slot:focus-visible {
  outline: 2px solid rgba(0, 181, 160, 0.8);
  outline-offset: 2px;
}
.advanced-toggle:focus-visible {
  outline: 2px solid rgba(123, 154, 255, 0.7);
  outline-offset: 2px;
}

/* ── Disclosure progressivo (Configurações da IA) ── */
.advanced-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px;
  cursor: pointer;
  user-select: none;
  transition: background .2s, border-color .2s;
}
.advanced-toggle:hover {
  background: rgba(123,154,255,0.06);
  border-color: rgba(123,154,255,0.22);
}
.advanced-toggle-ico {
  font-family: 'Material Symbols Outlined';
  font-size: 15px;
  color: #4d5570;
  font-variation-settings: 'FILL' 0, 'wght' 300;
}
.advanced-toggle-label {
  font-family: 'Space Grotesk', sans-serif;

<script>
/* ── Calendar ── */
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const WEEKDAYS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const TIMES = ['08:00','09:00','10:00','11:00','13:00','14:00','15:00','16:00','17:00','18:00'];

let calDate = new Date();
let selectedDay = null;
let selectedTime = null;

function toggleScheduler() {
  const panel = document.getElementById('schedulerPanel');
  const arrow = document.getElementById('toggleArrow');
  const isOpen = panel.classList.contains('open');

  panel.classList.toggle('open', !isOpen);
  arrow.classList.toggle('open', !isOpen);

  if (!isOpen) {
    calDate = new Date();
    renderCalendar();
    renderTimeSlots();

    // Faz o scroll suave usando o botão como âncora fixa
    setTimeout(() => {
      const toggle = document.getElementById('scheduleToggle');
      
      // Pegamos a posição do botão que você clicou
      const toggleTop = toggle.getBoundingClientRect().top + window.pageYOffset;
      
      // Miramos um pouco abaixo do botão (offset de ~200px) 
      // Isso garante que o botão e o calendário fiquem perfeitamente centralizados
      const scrollTarget = toggleTop - (window.innerHeight / 2) + 200;

      window.scrollTo({
        top: scrollTarget,
        behavior: 'smooth'
      });
    }, 150);
  }
}

function changeMonth(dir) {
  calDate.setMonth(calDate.getMonth() + dir);
  renderCalendar();
}

function renderCalendar() {
  const grid  = document.getElementById('calGrid');
  const label = document.getElementById('calMonth');
  const today = new Date();
  today.setHours(0,0,0,0);

  const y = calDate.getFullYear();
  const m = calDate.getMonth();
  label.textContent = `${MONTHS[m]} ${y}`;

  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();

  let html = WEEKDAYS.map(d => `<div class="cal-weekday">${d}</div>`).join('');

  for (let i = 0; i < firstDay; i++) html += `<div class="cal-day empty"></div>`;

  for (let d = 1; d <= daysInMonth; d++) {
    const thisDate = new Date(y, m, d);
    thisDate.setHours(0,0,0,0);
    const isPast    = thisDate < today;
    const isToday   = thisDate.getTime() === today.getTime();
    const isSel     = selectedDay && thisDate.getTime() === selectedDay.getTime();
    let cls = 'cal-day';
    if (isPast)   cls += ' past';
    if (isToday)  cls += ' today';
    if (isSel)    cls += ' selected';
    const onclick = isPast ? '' : `onclick="selectDay(${y},${m},${d})"`;
    const a11y   = (!isPast) ? `role="button" tabindex="0"` : '';
    html += `<div class="${cls}" ${onclick} ${a11y}>${d}</div>`;
  }

  grid.innerHTML = html;
}

function selectDay(y, m, d) {
  selectedDay  = new Date(y, m, d);
  selectedTime = null;
  renderCalendar();
  renderTimeSlots();
  
  // Esta é a linha que ativa o fade suave dos horários:
  document.getElementById('timeSlotsWrap').classList.add('visible');
  
  updateSummary();
}

function renderTimeSlots() {
  const wrap = document.getElementById('timeSlots');
  wrap.innerHTML = TIMES.map(t => {
    const isSel = t === selectedTime;
    return `<div class="time-slot${isSel ? ' selected' : ''}" role="button" tabindex="0" onclick="selectTime('${t}')">${t}</div>`;
  }).join('');
}

function selectTime(t) {
  selectedTime = t;
  renderTimeSlots();
  updateSummary();
}

function updateSummary() {
  const summary     = document.getElementById('scheduleSummary');
  const summaryText = document.getElementById('summaryText');
  const toggleText  = document.getElementById('toggleText');
  const label       = document.getElementById('btnLabel');
  const ico         = document.getElementById('btnIco');

  if (selectedDay && selectedTime) {
    const opts = { weekday:'short', day:'numeric', month:'short' };
    const dateStr = selectedDay.toLocaleDateString('pt-BR', opts);
    
    summaryText.textContent = `✓ Confirmado — aguardando disparo`;
    summary.classList.add('visible');
    toggleText.innerHTML = `Agendado: <span>${dateStr} · ${selectedTime}</span>`;

    // Atualiza os textos do botão para o modo agendamento
    label.textContent = 'Agendar Ligação';
    ico.textContent   = 'schedule_send';
    
  } else {
    summary.classList.remove('visible');
    
    if (selectedDay) {
      toggleText.innerHTML = `Dia selecionado · escolha o <span>horário</span>`;
    } else {
      toggleText.innerHTML = `Ligar <span>agora</span> · clique para agendar`;
    }
    
    // Volta o botão para o texto original
    label.textContent = 'Iniciar Ligação';
    ico.textContent   = 'call';
  }

  // A MÁGICA: Chama a validação para decidir se o botão ganha o brilho minimalista
  checkFormReady();
}

/* ── Submit ── */
function setPill(cls, dotCls, text) {
  document.getElementById('pill').className = 'pill ' + cls;
  document.getElementById('dot').className  = 'dot ' + dotCls;
  document.getElementById('pillText').textContent = text;
}

function handleSubmit(e) {
  e.preventDefault();
  
  const nomeInput = document.getElementById('nome');
  const telefoneInput = document.getElementById('telefone');
  const nome = nomeInput.value.trim();
  const telefoneNumeros = telefoneInput.value.replace(/\D/g, '');
  const alertBox = document.getElementById('validationAlert');
  const alertText = document.getElementById('alertText');

  // Validações
  const isNomeValid = nome.length >= 2;
  const isTelefoneValid = telefoneNumeros.length === 10 || telefoneNumeros.length === 11;

  // Feedback visual nos inputs
  nomeInput.classList.toggle('input-error', !isNomeValid);
  telefoneInput.classList.toggle('input-error', !isTelefoneValid);

  let errorMsg = [];
  if (!isNomeValid) errorMsg.push("• Por favor, insira um nome válido.");
  if (!isTelefoneValid) errorMsg.push("• O telefone precisa estar completo (com DDD).");

  // Ativa a gaveta de erro e cancela o envio
  if (errorMsg.length > 0) {
    alertText.innerHTML = errorMsg.join("<br>");
    alertBox.classList.add('show');
    return; 
  }

  // Esconde o alerta caso o usuário tenha corrigido o erro
  alertBox.classList.remove('show');

  // O DADO LIMPO PARA O SEU BACKEND PYTHON/N8N
  const telefoneFinal = '+55' + telefoneNumeros; 
  console.log("Payload pronto para envio:", telefoneFinal);

  const btn   = document.getElementById('submitBtn');
  const ico   = document.getElementById('btnIco');
  const label = document.getElementById('btnLabel');
  const isScheduled = selectedDay && selectedTime;

  btn.disabled = true;
  ico.textContent   = 'hourglass_empty';
  label.textContent = isScheduled ? 'Agendando...' : 'Conectando...';
  setPill('pill-call', 'dot-blue', isScheduled ? 'Agendando...' : 'Conectando...');

  setTimeout(() => {
    if (isScheduled) {
      ico.textContent   = 'event_available';
      label.textContent = 'Agendado!';
      setPill('pill-done', 'dot-teal', 'Ligação agendada');
    } else {
      ico.textContent   = 'phone_in_talk';
      label.textContent = 'Em Andamento';
      setPill('pill-call', 'dot-blue', 'Ligação em andamento');
    }
  }, 2200);

  setTimeout(() => {
    btn.disabled      = false;
    ico.textContent   = 'call';
    label.textContent = 'Iniciar Ligação';
    setPill('pill-ready', 'dot-teal', 'Sistema Pronto');
    document.getElementById('callForm').reset();
    selectedDay = selectedTime = null;
    document.getElementById('scheduleSummary').classList.remove('visible');
    document.getElementById('schedulerPanel').classList.remove('open');
    document.getElementById('toggleArrow').classList.remove('open');
    document.getElementById('toggleText').innerHTML = 'Ligar <span>agora</span> · clique para agendar';
    
    checkFormReady(); 
  }, isScheduled ? 4000 : 9000);
}

// MÁSCARA AUTOMÁTICA DE TELEFONE — com cursor inteligente (sem salto para o final)
document.getElementById('telefone').addEventListener('input', function (e) {
  const input = e.target;
  const cursorPos = input.selectionStart;
  const digitsBeforeCursor = input.value.slice(0, cursorPos).replace(/\D/g, '').length;

  let x = input.value.replace(/\D/g, '');
  let newValue;

  if (x.length === 0) {
    newValue = '';
  } else if (x.length <= 2) {
    newValue = '(' + x;
  } else if (x.length <= 6) {
    newValue = '(' + x.substring(0, 2) + ') ' + x.substring(2);
  } else if (x.length <= 10) {
    newValue = '(' + x.substring(0, 2) + ') ' + x.substring(2, 6) + '-' + x.substring(6);
  } else {
    newValue = '(' + x.substring(0, 2) + ') ' + x.substring(2, 7) + '-' + x.substring(7, 11);
  }

  input.value = newValue;

  // Reposiciona o cursor: encontra a posição após o N-ésimo dígito e avança formatação automática
  let newCursorPos = newValue.length;
  if (digitsBeforeCursor === 0) {
    newCursorPos = 0;
  } else {
    let digitCount = 0;
    for (let i = 0; i < newValue.length; i++) {
      if (/\d/.test(newValue[i])) {
        digitCount++;
        if (digitCount === digitsBeforeCursor) {
          newCursorPos = i + 1;
          // Avança sobre caracteres de formatação inseridos automaticamente
          while (newCursorPos < newValue.length && !/\d/.test(newValue[newCursorPos])) {
            newCursorPos++;
          }
          break;
        }
      }
    }
  }

  input.setSelectionRange(newCursorPos, newCursorPos);
  checkFormReady();
});

function checkFormReady() {
  const nome = document.getElementById('nome').value.trim();
  const telefoneNumeros = document.getElementById('telefone').value.replace(/\D/g, ''); 
  const btn = document.getElementById('submitBtn');

  const isNomeValid = nome.length >= 2;
  const isTelefoneValid = telefoneNumeros.length === 10 || telefoneNumeros.length === 11;
  const isScheduled = selectedDay && selectedTime;

  btn.classList.remove('ready-immediate', 'ready-scheduled');

  if (isNomeValid && isTelefoneValid) {
    if (isScheduled) {
      btn.classList.add('ready-scheduled');
    } else {
      btn.classList.add('ready-immediate');
    }
  }
}

// Validação em tempo real + limpa borda de erro ao começar a corrigir
document.getElementById('nome').addEventListener('input', function() {
  this.classList.remove('input-error');
  checkFormReady();
});
document.getElementById('telefone').addEventListener('input', checkFormReady);

/* ── Acessibilidade por teclado ── */

// scheduleToggle: Enter/Espaço abre o calendário
document.getElementById('scheduleToggle').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    toggleScheduler();
  }
});

// Calendário: delegação no grid (Enter/Espaço seleciona o dia)
document.getElementById('calGrid').addEventListener('keydown', function(e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const day = e.target.closest('.cal-day');
  if (day && !day.classList.contains('empty') && !day.classList.contains('past')) {
    e.preventDefault();
    day.click();
  }
});

// Horários: delegação no container (Enter/Espaço seleciona o horário)
document.getElementById('timeSlots').addEventListener('keydown', function(e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const slot = e.target.closest('.time-slot');
  if (slot) {
    e.preventDefault();
    slot.click();
  }
});

// advancedToggle: Enter/Espaço abre configurações da IA
document.getElementById('advancedToggle').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    toggleAdvanced();
  }
});

/* ── Disclosure progressivo: Configurações da IA ── */
function toggleAdvanced() {
  const panel  = document.getElementById('advancedPanel');
  const arrow  = document.getElementById('advancedArrow');
  const toggle = document.getElementById('advancedToggle');
  const isOpen = panel.classList.contains('open');
  panel.classList.toggle('open', !isOpen);
  arrow.classList.toggle('open', !isOpen);
  toggle.setAttribute('aria-expanded', String(!isOpen));
  panel.setAttribute('aria-hidden', String(isOpen));
}

/* ── Sync aria-expanded no scheduleToggle ── */
const _origToggle = toggleScheduler;
toggleScheduler = function() {
  _origToggle();
  const panel  = document.getElementById('schedulerPanel');
  const toggle = document.getElementById('scheduleToggle');
  toggle.setAttribute('aria-expanded', String(panel.classList.contains('open')));
};
</script>

<!-- ══════════════════════════════════════════
     MINDFLOW — Dot Grid Wave Animation
════════════════════════════════════════════ -->
<script>
(function () {
  const cv  = document.getElementById('neural-canvas');
  const ctx = cv.getContext('2d');
  let W, H, t = 0;
  let dots = [], mouse = { x: -9999, y: -9999 };

  const BLUE = [46, 79, 255];
  const TEAL = [0, 181, 160];
  const GAP  = 38;

  function rgba(rgb, a) {
    return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a.toFixed(3)})`;
  }

  function resize() {
    W = cv.width  = window.innerWidth;
    H = cv.height = window.innerHeight;
    buildGrid();
  }

  function buildGrid() {
    dots = [];
    const cols = Math.ceil(W / GAP) + 2;
    const rows = Math.ceil(H / GAP) + 2;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        dots.push({
          bx: c * GAP - GAP,
          by: r * GAP - GAP,
          phase: (c * 0.35 + r * 0.55) + Math.random() * 0.4,
          colorPhase: Math.random() * Math.PI * 2,
        });
      }
    }
  }

  const WAVES = [
    { nx:0.18, ny:0.72, speed:0.00018, ox:0.0 },
    { nx:0.82, ny:0.28, speed:0.00014, ox:2.1 },
    { nx:0.50, ny:0.15, speed:0.00020, ox:4.2 },
  ];

  function waveAt(wx, wy, dx, dy) {
    const dist = Math.sqrt(dx * dx + dy * dy);
    return Math.sin(dist * 0.022 - t * 0.045 + wx * 0.01 + wy * 0.01) *
           Math.exp(-dist / (Math.min(W, H) * 0.55));
  }

  function frame() {
    ctx.fillStyle = '#04060E';
    ctx.fillRect(0, 0, W, H);
    const time = t;

    dots.forEach(d => {
      let influence = 0;
      WAVES.forEach(wv => {
        const wx = (wv.nx + Math.sin(time * wv.speed + wv.ox) * 0.18) * W;
        const wy = (0.5   + Math.cos(time * wv.speed + wv.ox) * 0.22) * H;
        influence += waveAt(wx, wy, d.bx - wx, d.by - wy);
      });
      influence /= WAVES.length;

      const x = d.bx + Math.sin(d.phase + time * 0.018) * 3.5 * influence * 4;
      const y = d.by + Math.cos(d.phase + time * 0.014) * 3.5 * influence * 4;
      const r = 0.9 + influence * 2.2;
      if (r <= 0) return;

      const colorMix = Math.sin(d.colorPhase + time * 0.008 + influence * 3) * 0.5 + 0.5;
      const rgb = [
        Math.round(BLUE[0] + (TEAL[0] - BLUE[0]) * colorMix),
        Math.round(BLUE[1] + (TEAL[1] - BLUE[1]) * colorMix),
        Math.round(BLUE[2] + (TEAL[2] - BLUE[2]) * colorMix),
      ];

      const mdx = d.bx - mouse.x;
      const mdy = d.by - mouse.y;
      const mouseGlow = Math.max(0, 1 - Math.sqrt(mdx*mdx + mdy*mdy) / 140);
      const brightness = 0.06 + Math.max(0, influence) * 0.55 + mouseGlow * 0.6;

      const glow = ctx.createRadialGradient(x, y, 0, x, y, r * 5);
      glow.addColorStop(0,   rgba(rgb, brightness * 0.5));
      glow.addColorStop(0.4, rgba(rgb, brightness * 0.12));
      glow.addColorStop(1,   rgba(rgb, 0));
      ctx.beginPath(); ctx.arc(x, y, r * 5, 0, Math.PI * 2);
      ctx.fillStyle = glow; ctx.fill();

      ctx.beginPath(); ctx.arc(x, y, Math.max(0.3, r), 0, Math.PI * 2);
      ctx.fillStyle = rgba(rgb, 0.18 + Math.max(0, influence) * 0.65 + mouseGlow * 0.8);
      ctx.fill();
    });

    t++;
    requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
  frame();
})();
</script>
