<style>
/* ── Reset & base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue:  #2E4FFF;
  --teal:  #00B5A0;
  --blue2: #7B9AFF;
  --bg:    #04060E;
}

body {
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-top: 52px;
  overflow-x: hidden;
  font-family: 'Inter', sans-serif;
  color: #2D3448;
  -webkit-font-smoothing: antialiased;
}

/* ── Canvas ── */
#neural-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* ── Navbar ── */
.navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  background: rgba(4,6,14,0.65);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  z-index: 50;
}

.logo-mark {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: #fff;
}

.logo-icon-sm {
  width: 28px; height: 28px;
  border: 1.5px solid #fff;
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700; font-size: 11px;
  letter-spacing: -0.04em;
}

.logo-name {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  font-size: 16px;
  letter-spacing: -0.025em;
}

/* ── Card with animated gradient border ── */
@property --ba {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}

@keyframes spin-border { to { --ba: 360deg; } }

.card {
  --ba: 0deg;
  animation: spin-border 9s linear infinite;

  /* The key trick: padding-box = glass fill, border-box = gradient border */
  background:
    linear-gradient(rgba(8,12,24,0.72), rgba(8,12,24,0.72)) padding-box,
    conic-gradient(
      from var(--ba),
      rgba(46,79,255,0)   0%,
      rgba(46,79,255,.75) 15%,
      rgba(0,181,160,.75) 38%,
      rgba(46,79,255,.75) 62%,
      rgba(0,181,160,.55) 80%,
      rgba(46,79,255,0)  100%
    ) border-box;
  border: 1px solid transparent;

  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-radius: 16px;
  width: 100%;
  max-width: 540px;
  padding: 44px 44px 40px;

  /* Ambient outer glow (all sides) */
  box-shadow:
    0 0 40px rgba(46,79,255,.10),
    0 0 80px rgba(0,181,160,.07),
    0 32px 64px rgba(0,0,0,.55);

  position: relative;
  animation: spin-border 9s linear infinite, cardIn .65s cubic-bezier(.16,1,.3,1) both;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Card header ── */
.card-logo {
  display: flex; flex-direction: column; align-items: center;
  gap: 8px; margin-bottom: 24px;
}
.logo-icon-lg {
  width: 48px; height: 48px;
  border: 2.5px solid #fff;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700; font-size: 22px;
  letter-spacing: -0.06em;
  color: #fff;
}
.card-header {
  text-align: center;
  margin-bottom: 36px;
}
.card-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 28px; font-weight: 600;
  letter-spacing: -0.025em;
  color: #fff; margin-bottom: 6px;
}
.card-sub {
  font-size: 14px; color: #8e8fa2;
}

/* ── Form ── */
.form { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

label {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px; font-weight: 500;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: #8e8fa2;
  margin-left: 2px;
}

.input-wrap { position: relative; display: flex; align-items: center; }

.input-ico {
  position: absolute; left: 12px;
  font-family: 'Material Symbols Outlined';
  font-size: 16px;
  color: #444656;
  pointer-events: none;
  user-select: none;
  font-variation-settings: 'FILL' 0, 'wght' 300;
}

input {
  width: 100%;
  height: 46px;
  background: rgba(4,6,14,.85);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 10px;
  color: #2D3448;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  padding: 0 14px;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
input.has-icon { padding-left: 38px; }
input.mono {
  font-family: 'Space Grotesk', monospace;
  font-size: 13px;
  letter-spacing: 0.06em;
  color: #4edcc5;
}
input::placeholder { color: #444656; }
input:focus {
  border-color: rgba(46,79,255,.75);
  box-shadow: 0 0 0 3px rgba(46,79,255,.14);
}
input:hover:not(:focus) { border-color: rgba(255,255,255,.18); }
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus {
  -webkit-text-fill-color: #2D3448;
  -webkit-box-shadow: 0 0 0px 1000px rgba(255,255,255,1) inset;
  transition: background-color 5000s ease-in-out 0s;
}

/* ── Divider ── */
.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.09), transparent);
  margin: 4px 0;
}

/* ── Button ── */
.btn {
  width: 100%; height: 52px;
  background: linear-gradient(135deg, var(--blue) 0%, var(--teal) 100%);
  border: none; border-radius: 10px;
  color: #fff;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px; font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  margin-top: 8px;
  transition: box-shadow .25s, opacity .2s, transform .12s;
}
.btn:hover:not(:disabled) { box-shadow: 0 0 28px rgba(46,79,255,.4); }
.btn:active:not(:disabled) { transform: scale(.985); }
.btn:disabled { opacity: .6; cursor: not-allowed; }
.btn .ico {
  font-family: 'Material Symbols Outlined';
  font-size: 18px;
  font-variation-settings: 'FILL' 0, 'wght' 400;
}

/* ── Status pill ── */
.status {
  margin-top: 22px;
  display: flex; justify-content: center;
}
.pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 18px;
  border-radius: 9999px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px; font-weight: 500;
  letter-spacing: 0.09em; text-transform: uppercase;
  transition: all .35s ease;
}
.pill-ready  { background: rgba(78,220,197,.07); border: 1px solid rgba(78,220,197,.25); color: #4edcc5; }
.pill-call   { background: rgba(46,79,255,.10);  border: 1px solid rgba(46,79,255,.30); color: #7B9AFF; }
.pill-done   { background: rgba(78,220,197,.1);  border: 1px solid rgba(78,220,197,.35); color: #4edcc5; }

.dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  animation: dotpulse 2.2s ease-in-out infinite;
}
.dot-teal { background: #4edcc5; box-shadow: 0 0 6px #4edcc5; }
.dot-blue { background: #7B9AFF; box-shadow: 0 0 6px #7B9AFF; }
@keyframes dotpulse {
  0%,100% { opacity:1; transform:scale(1); }
  50%      { opacity:.4; transform:scale(.75); }
}

/* ── Main wrapper ── */
main {
  position: relative; z-index: 1;
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 24px 16px;
  width: 100%;
}
</style>
</head>

<!-- ══════════════════════════════════════════
     NEURAL CANVAS — Synaptic Flow Animation
     Nodes drift organically. Nearby nodes link
     with faint lines. Particles travel along
     connections and light them up on passage.
     Colors: MindFlow blue #2E4FFF + teal #00B5A0
════════════════════════════════════════════ -->
<script>
(function () {
  const cv  = document.getElementById('neural-canvas');
  const ctx = cv.getContext('2d');
  let W, H;

  /* ── Config ── */
  const N_NODES        = 32;
  const LINK_DIST      = 180;   // max px between linked nodes
  const MAX_PARTICLES  = 50;
  const SPAWN_INTERVAL = 18;    // frames between spawn attempts
  const SPEED_NODE     = 0.28;
  const SPEED_P_MIN    = 0.004;
  const SPEED_P_MAX    = 0.010;
  const BLUE  = '#2E4FFF';
  const TEAL  = '#00B5A0';
  const BLUE2 = '#7B9AFF';

  /* ── State ── */
  let nodes = [], particles = [], t = 0;

  /* ── Helpers ── */
  function hex2rgb(h) {
    const n = parseInt(h.slice(1), 16);
    return [(n>>16)&255, (n>>8)&255, n&255];
  }
  const rgbBlue = hex2rgb(BLUE), rgbTeal = hex2rgb(TEAL), rgbBlue2 = hex2rgb(BLUE2);

  function rgba(rgb, a) {
    return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a.toFixed(3)})`;
  }

  /* ── Resize ── */
  function resize() {
    W = cv.width  = window.innerWidth;
    H = cv.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', () => { resize(); initNodes(); });

  /* ── Nodes ── */
  function mkNode() {
    const angle = Math.random() * Math.PI * 2;
    const speed = SPEED_NODE * (0.5 + Math.random() * 0.8);
    const color = Math.random() > 0.5 ? rgbBlue : rgbTeal;
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: 1.4 + Math.random() * 1.6,
      phase: Math.random() * Math.PI * 2,
      color,
    };
  }

  function initNodes() {
    nodes = Array.from({ length: N_NODES }, mkNode);
    particles = [];
  }

  /* ── Particles ── */
  function spawnParticle() {
    if (particles.length >= MAX_PARTICLES) return;

    const fi = Math.floor(Math.random() * nodes.length);
    const f  = nodes[fi];
    const cands = [];

    nodes.forEach((n, i) => {
      if (i === fi) return;
      const dx = n.x - f.x, dy = n.y - f.y;
      if (dx*dx + dy*dy < LINK_DIST * LINK_DIST) cands.push(i);
    });

    if (!cands.length) return;
    const ti = cands[Math.floor(Math.random() * cands.length)];
    const colorRgb = Math.random() > 0.45 ? rgbTeal : rgbBlue2;

    particles.push({
      fi, ti,
      progress: 0,
      speed: SPEED_P_MIN + Math.random() * (SPEED_P_MAX - SPEED_P_MIN),
      colorRgb,
      size: 1.5 + Math.random() * 1.5,
      trail: [],
    });
  }

  /* ── Draw ── */
  function frame() {
    /* Background */
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#04060E';
    ctx.fillRect(0, 0, W, H);

    /* Move nodes (wrap) */
    nodes.forEach(n => {
      n.x = (n.x + n.vx + W) % W;
      n.y = (n.y + n.vy + H) % H;
    });

    /* ── Static connections ── */
    ctx.globalCompositeOperation = 'screen';
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d2 = dx*dx + dy*dy;
        if (d2 > LINK_DIST * LINK_DIST) continue;
        const alpha = (1 - Math.sqrt(d2) / LINK_DIST) * 0.10;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = `rgba(100,140,255,${alpha.toFixed(3)})`;
        ctx.lineWidth = 0.6;
        ctx.stroke();
      }
    }

    /* ── Particles ── */
    particles = particles.filter(p => {
      const f = nodes[p.fi], to = nodes[p.ti];
      if (!f || !to) return false;

      /* Advance */
      p.progress += p.speed;
      if (p.progress >= 1) return false;

      const ease = Math.sin(p.progress * Math.PI);

      /* Lit connection */
      ctx.beginPath();
      ctx.moveTo(f.x, f.y);
      ctx.lineTo(to.x, to.y);
      ctx.strokeStyle = rgba(p.colorRgb, ease * 0.55);
      ctx.lineWidth = 0.9;
      ctx.stroke();

      /* Particle position */
      const px = f.x + (to.x - f.x) * p.progress;
      const py = f.y + (to.y - f.y) * p.progress;

      /* Glow halo */
      const halo = ctx.createRadialGradient(px, py, 0, px, py, 14);
      halo.addColorStop(0,   rgba(p.colorRgb, ease * 0.7));
      halo.addColorStop(0.4, rgba(p.colorRgb, ease * 0.2));
      halo.addColorStop(1,   rgba(p.colorRgb, 0));
      ctx.beginPath();
      ctx.arc(px, py, 14, 0, Math.PI * 2);
      ctx.fillStyle = halo;
      ctx.fill();

      /* Core dot */
      ctx.beginPath();
      ctx.arc(px, py, p.size * (0.7 + ease * 0.6), 0, Math.PI * 2);
      ctx.fillStyle = rgba([255,255,255], ease * 0.9 + 0.1);
      ctx.fill();

      return true;
    });

    /* ── Nodes ── */
    nodes.forEach(n => {
      const pulse = Math.sin(t * 0.022 + n.phase) * 0.5 + 0.5;
      const r = n.r + pulse * 1.8;

      /* Node halo */
      const halo = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r * 9);
      halo.addColorStop(0, rgba(n.color, 0.28 + pulse * 0.12));
      halo.addColorStop(0.5, rgba(n.color, 0.06));
      halo.addColorStop(1, rgba(n.color, 0));
      ctx.beginPath();
      ctx.arc(n.x, n.y, r * 9, 0, Math.PI * 2);
      ctx.fillStyle = halo;
      ctx.fill();

      /* Node core */
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.fillStyle = rgba(n.color, 0.75 + pulse * 0.25);
      ctx.fill();
    });

    ctx.globalCompositeOperation = 'source-over';

    /* Spawn */
    if (t % SPAWN_INTERVAL === 0) spawnParticle();

    t++;
    requestAnimationFrame(frame);
  }

  initNodes();
  frame();
})();
</script>

<!-- Phone mask -->
<script>
document.getElementById('telefone').addEventListener('input', function (e) {
  let v = e.target.value.replace(/\D/g,'').slice(0,11);
  if (v.length > 7)      v = `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;
  else if (v.length > 2) v = `(${v.slice(0,2)}) ${v.slice(2)}`;
  else if (v.length > 0) v = `(${v}`;
  e.target.value = v;
});
</script>

<!-- Submit flow -->
<script>
function setPill(cls, dotCls, text) {
  const pill = document.getElementById('pill');
  const dot  = document.getElementById('dot');
  pill.className = 'pill ' + cls;
  dot.className  = 'dot ' + dotCls;
  document.getElementById('pillText').textContent = text;
}

function handleSubmit(e) {
  e.preventDefault();
  const nome     = document.getElementById('nome').value.trim();
  const telefone = document.getElementById('telefone').value.trim();
  if (!nome)     { document.getElementById('nome').focus();     return; }
  if (!telefone) { document.getElementById('telefone').focus(); return; }

  const btn   = document.getElementById('submitBtn');
  const ico   = document.getElementById('btnIco');
  const label = document.getElementById('btnLabel');

  btn.disabled = true;
  ico.textContent   = 'hourglass_empty';
  label.textContent = 'Conectando...';
  setPill('pill-call', 'dot-blue', 'Conectando...');

  setTimeout(() => {
    ico.textContent   = 'phone_in_talk';
    label.textContent = 'Em Andamento';
    setPill('pill-call', 'dot-blue', 'Ligação em andamento');
  }, 2200);

  setTimeout(() => {
    ico.textContent   = 'call_end';
    label.textContent = 'Ligação Encerrada';
    setPill('pill-done', 'dot-teal', 'Finalizada com sucesso');
  }, 7500);

  setTimeout(() => {
    btn.disabled      = false;
    ico.textContent   = 'call';
    label.textContent = 'Iniciar Ligação';
    setPill('pill-ready', 'dot-teal', 'Sistema Pronto');
    document.getElementById('callForm').reset();
  }, 10000);
}
</script>
